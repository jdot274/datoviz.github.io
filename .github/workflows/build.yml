name: Build Documentation

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout documentation repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Datoviz source
        uses: actions/checkout@v4
        with:
          repository: datoviz/datoviz
          path: datoviz-source
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          cd datoviz-source
          pip install -r requirements-dev.txt

      - name: Build documentation
        run: |
          cd datoviz-source
          mkdocs build
          cd ..

      - name: Deploy to GitHub Pages
        run: |
          # Copy built documentation to root
          rm -rf docs gallery guide quickstart reference visuals discussions assets stylesheets search images *.html *.xml *.gz *.inv
          cp -r datoviz-source/site/* .
          
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Commit and push
          git add .
          git diff --staged --quiet || git commit -m "Deploy documentation from datoviz/datoviz"
          git push
